name: Build Silksong (nxnative)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Checkout (repo de build, sin archivos del juego)
        uses: actions/checkout@v4

      - name: Seleccionar Xcode 27.2 y liberar disco
        run: |
          for d in /Applications/Xcode_27.2.app /Applications/Xcode_27.2.0.app; do
            if [ -d "$d" ]; then sudo xcode-select -s "$d"; echo "Seleccionado $d"; fi
          done
          xcodebuild -version
          xcrun -sdk macosx metal --version
          for d in /Applications/Xcode*.app; do
            case "$(basename "$d")" in
              *27.2*) echo "mantengo $d" ;;
              *) echo "borro $d"; sudo rm -rf "$d" ;;
            esac
          done
          rm -rf ~/Library/Android 2>/dev/null || true
          rm -rf ~/Library/Developer/CoreSimulator 2>/dev/null || true
          sudo rm -rf /Applications/GarageBand.app /Applications/iMovie.app /Applications/Keynote.app /Applications/Numbers.app /Applications/Pages.app 2>/dev/null || true
          df -h /

      - name: Herramientas y nxnative (upstream, al día)
        run: |
          xcodebuild -downloadComponent MetalToolchain
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk || true
          python3 -m pip install --user --break-system-packages lz4 "capstone>=5,<6" fonttools nsz zbic
          python3 -m pip install --user --break-system-packages "backports.zstd; python_version < '3.14'" || true
          cd ~ && git clone --depth 1 https://github.com/seedds/nxnative.git

      - name: Parche - lanzador en español y controles tipo Android
        run: |
          python3 "$GITHUB_WORKSPACE/tools/parche_silksong.py" ~/nxnative

      - name: Descargar el juego desde la release privada
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          mkdir -p ~/Games/Silksong ~/keys
          cd ~/Games/Silksong
          gh release download game --repo ShebasK0908/silksong-build --dir dl
          ls -la dl
          cp dl/prod.keys ~/keys/prod.keys
          test -s ~/keys/prod.keys
          cat dl/update-part-* > "[010013C00E930800].nsp"
          test $(stat -f%z "[010013C00E930800].nsp") -eq 611417424
          cat dl/base-part-* > "[010013C00E930000].nsp"
          ls -la
          test $(stat -f%z "[010013C00E930000].nsp") -eq 2492437328
          head -c 4 "[010013C00E930000].nsp" | grep -q PFS0
          head -c 4 "[010013C00E930800].nsp" | grep -q PFS0

      - name: Build del IPA (idioma del juego - español)
        run: |
          python3 ~/nxnative/scripts/build_ipa_from_nsp.py ~/Games/Silksong -k ~/keys/prod.keys -l es --no-keep-extracted
          ls -la ~/Games/Silksong

      - name: Subir el resultado a la release privada
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          cd ~/Games/Silksong
          IPA=$(find . -maxdepth 2 -name '*.ipa' | head -1)
          test -n "$IPA"
          ls -la "$IPA"
          split -b 1900m "$IPA" ipa-part-
          PARTS=$(ls ipa-part-*)
          gh release create silksong-ipa $PARTS --repo ShebasK0908/silksong-build --title "Silksong IPA (privado)" --notes "Build propia del usuario desde su copia. No compartir." || gh release upload silksong-ipa $PARTS --clobber --repo ShebasK0908/silksong-build
